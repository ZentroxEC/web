<script>


    /* =====================================================
       =====================================================
       CONFIGURACIÓN DEL PRODUCTO
       =====================================================
    ====================================================== */


    /*
     * =====================================================
     * EDITAR AQUÍ EL PRECIO DE UNA UNIDAD
     *
     * Actualmente:
     *
     * 1 unidad = US$10
     *
     * Si algún día cambias el precio de una unidad,
     * solamente cambia este número.
     * =====================================================
    */

    const PRECIO_UNITARIO = 10;



    /*
     * =====================================================
     * ENLACE DE PAGO PARA CADA CANTIDAD
     *
     * CANTIDAD 1:
     *
     * Se obtiene automáticamente del href actual
     * del botón COMPRAR AHORA.
     *
     * Por eso NO necesitas colocar aquí
     * el enlace de US$10.
     * =====================================================
    */

    const botonComprar =
        document.getElementById("botonComprar");


    const LINK_10 =
        botonComprar.getAttribute("href");



    /*
     * =====================================================
     * EDITAR:
     *
     * ENLACE DE PAGO PARA 2 UNIDADES
     *
     * 2 x US$10 = US$20
     * =====================================================
    */

    const LINK_20 =
        "https://ppls.me/OnmwepzpJyIEMrq7uoPn9g";



    /*
     * =====================================================
     * EDITAR:
     *
     * ENLACE DE PAGO PARA 3 UNIDADES
     *
     * 3 x US$10 = US$30
     * =====================================================
    */

    const LINK_30 =
        "https://ppls.me/NUp6yYWJ8LcXDd9jnvRA";



    /*
     * =====================================================
     * EDITAR:
     *
     * ENLACE DE PAGO PARA 4 UNIDADES
     *
     * 4 x US$10 = US$40
     * =====================================================
    */

    const LINK_40 =
        "https://ppls.me/SYxHVTiGHCdhEYtqRDHwA";



    /* =====================================================
       =====================================================
       ACTUALIZAR CANTIDAD, PRECIO Y PAGO
       =====================================================
    ====================================================== */


    function actualizarProducto() {


        /*
         * =================================================
         * OBTENER CANTIDAD SELECCIONADA
         * =================================================
        */

        const cantidad =
            parseInt(
                document.getElementById(
                    "cantidadProducto"
                ).value
            );



        /*
         * =================================================
         * CALCULAR PRECIO
         *
         * Ejemplo:
         *
         * 1 × 10 = 10
         * 2 × 10 = 20
         * 3 × 10 = 30
         * 4 × 10 = 40
         * =================================================
        */

        const precioTotal =
            PRECIO_UNITARIO * cantidad;



        /*
         * =================================================
         * MOSTRAR NUEVO PRECIO
         * =================================================
        */

        document.getElementById(
            "precioProducto"
        ).textContent =
            "US$ " + precioTotal;



        /*
         * =================================================
         * CAMBIAR AUTOMÁTICAMENTE EL ENLACE DE COMPRA
         * =================================================
        */

        if (cantidad === 1) {

            botonComprar.href =
                LINK_10;

        }

        else if (cantidad === 2) {

            botonComprar.href =
                LINK_20;

        }

        else if (cantidad === 3) {

            botonComprar.href =
                LINK_30;

        }

        else if (cantidad === 4) {

            botonComprar.href =
                LINK_40;

        }

    }



    /*
     * =====================================================
     * INICIALIZAR PRODUCTO
     *
     * Al cargar la página comienza con:
     *
     * Cantidad: 1
     * Precio: US$10
     * Enlace: enlace original de US$10
     * =====================================================
    */

    actualizarProducto();


</script>
