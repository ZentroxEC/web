<script>

    /* =====================================================
       🔴 APPS SCRIPT

       Este es tu enlace /exec.

       NO CAMBIAR salvo que hagas una nueva implementación.
       ===================================================== */

    const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzfVmHhyISYruGRZk3R30fBiCvOM5Gv5rQODIsxlMqCIiIsBF_8T6AFvhQTVUf7cMfb/exec";


    /* =====================================================
       🔴 CONFIGURACIÓN DEL PRODUCTO

       Precio de 1 unidad:
       $10

       La cantidad puede venir desde verproducto.html.

       Ejemplo:

       cantidad=1 → $10
       cantidad=2 → $20

       Si posteriormente cambias el precio unitario,
       solamente cambia PRECIO_UNITARIO.
       ===================================================== */

    const PRECIO_UNITARIO = 10;


    /* =====================================================
       🔴 ENLACES DE PAYPHONE

       Cada cantidad tiene su propio enlace.

       Cantidad 1 → $10
       Cantidad 2 → $20

       Si agregas más cantidades, puedes añadirlas aquí.
       ===================================================== */

    const PAYPHONE_LINKS = {

        1:
            "https://ppls.me/KT8CHtyeUHxwBmYlg5NIyA",

        2:
            "https://ppls.me/OnmwepzpJyIEMrq7uoPn9g"

    };


    /* =====================================================
       🔴 RECIBIR DATOS DESDE verproducto.html

       verproducto.html debe enviar al usuario a:

       comprar.html?cantidad=1

       o:

       comprar.html?cantidad=2

       También puede enviar el precio:

       comprar.html?cantidad=2&precio=20

       PERO comprar.html NO confiará en ese precio.

       El precio siempre será calculado aquí:

       cantidad × PRECIO_UNITARIO
       ===================================================== */

    const parametrosURL =
        new URLSearchParams(
            window.location.search
        );


    /* =====================================================
       OBTENER CANTIDAD
       ===================================================== */

    let cantidad =
        parseInt(
            parametrosURL.get("cantidad"),
            10
        );


    /* =====================================================
       VALIDAR CANTIDAD

       Actualmente permitimos:

       1
       2

       Si no llega una cantidad válida,
       utilizamos 1.
       ===================================================== */

    if (
        !Number.isInteger(cantidad) ||
        cantidad < 1 ||
        cantidad > 2
    ) {

        cantidad = 1;

    }


    /* =====================================================
       🔴 CALCULAR PRECIO

       IMPORTANTE:

       NO utilizamos directamente el precio recibido
       desde la URL.

       El precio se calcula:

       cantidad × precio unitario

       1 × $10 = $10
       2 × $10 = $20
       ===================================================== */

    let precioTotal =
        cantidad * PRECIO_UNITARIO;


    /* =====================================================
       ELEMENTOS DEL RESUMEN DE COMPRA
       ===================================================== */

    const cantidadProducto =
        document.getElementById(
            "cantidadProducto"
        );


    const precioProducto =
        document.getElementById(
            "precioProducto"
        );


    const subtotalProducto =
        document.getElementById(
            "subtotalProducto"
        );


    const totalProducto =
        document.getElementById(
            "totalProducto"
        );


    /* =====================================================
       🔴 ACTUALIZAR RESUMEN DE COMPRA

       Esta función modifica automáticamente:

       Cantidad
       Precio del producto
       Subtotal
       Total
       ===================================================== */

    function actualizarResumen() {


        cantidadProducto.textContent =
            "Cantidad: " + cantidad;


        precioProducto.textContent =
            "$" +
            precioTotal.toFixed(2);


        subtotalProducto.textContent =
            "$" +
            precioTotal.toFixed(2);


        totalProducto.textContent =
            "$" +
            precioTotal.toFixed(2);

    }


    /* =====================================================
       ACTUALIZAR EL RESUMEN AL ABRIR comprar.html
       ===================================================== */

    actualizarResumen();


    /* =====================================================
       PROVINCIA "OTRA"
       ===================================================== */

    const provincia =
        document.getElementById(
            "provincia"
        );


    const otraProvinciaContainer =
        document.getElementById(
            "otraProvinciaContainer"
        );


    const otraProvincia =
        document.getElementById(
            "otraProvincia"
        );


    provincia.addEventListener(
        "change",
        function () {

            if (
                this.value === "otra"
            ) {

                otraProvinciaContainer.style.display =
                    "block";

                otraProvincia.required =
                    true;

            } else {

                otraProvinciaContainer.style.display =
                    "none";

                otraProvincia.required =
                    false;

                otraProvincia.value =
                    "";

            }

        }
    );


    /* =====================================================
       🔴 CONTINUAR AL PAGO
       ===================================================== */

    async function continuarAlPago() {


        const formulario =
            document.getElementById(
                "formCompra"
            );


        const mensajeError =
            document.getElementById(
                "mensajeError"
            );


        const mensajeExito =
            document.getElementById(
                "mensajeExito"
            );


        const boton =
            document.getElementById(
                "btnPagar"
            );


        /* =================================================
           VALIDAR FORMULARIO
           ================================================= */

        if (
            !formulario.checkValidity()
        ) {

            mensajeError.textContent =
                "Completa todos los campos obligatorios antes de continuar.";

            mensajeError.classList.add(
                "mostrar"
            );

            formulario.reportValidity();

            return;

        }


        mensajeError.classList.remove(
            "mostrar"
        );


        /* =================================================
           OBTENER PROVINCIA
           ================================================= */

        let provinciaFinal =
            provincia.value;


        if (
            provincia.value === "otra"
        ) {

            provinciaFinal =
                otraProvincia.value.trim();

        }


        /* =================================================
           🔴 OBTENER PAYPHONE SEGÚN CANTIDAD

           1 → enlace de $10
           2 → enlace de $20
           ================================================= */

        const PAYPHONE_URL =
            PAYPHONE_LINKS[cantidad];


        /* =================================================
           SEGURIDAD

           Si no existe enlace para esa cantidad,
           detenemos el proceso.
           ================================================= */

        if (!PAYPHONE_URL) {

            mensajeError.textContent =
                "No existe un enlace de pago para esta cantidad.";

            mensajeError.classList.add(
                "mostrar"
            );

            return;

        }


        /* =================================================
           DESACTIVAR BOTÓN
           ================================================= */

        boton.disabled =
            true;

        boton.textContent =
            "Registrando pedido...";


        /* =================================================
           🔴 CREAR PEDIDO

           Los datos de cantidad, precio y total
           salen directamente de la información
           calculada por comprar.html.
           ================================================= */

        const pedido = {

            nombre:
                document.getElementById(
                    "nombre"
                ).value.trim(),


            telefono:
                document.getElementById(
                    "telefono"
                ).value.trim(),


            direccion:
                document.getElementById(
                    "direccion"
                ).value.trim(),


            sinNumero:
                document.getElementById(
                    "sinNumero"
                ).checked
                    ? "Sí"
                    : "No",


            provincia:
                provinciaFinal,


            canton:
                document.getElementById(
                    "canton"
                ).value.trim(),


            parroquia:
                document.getElementById(
                    "parroquia"
                ).value.trim(),


            calleSecundaria:
                document.getElementById(
                    "calleSecundaria"
                ).value.trim(),


            departamento:
                document.getElementById(
                    "departamento"
                ).value.trim(),


            indicaciones:
                document.getElementById(
                    "indicaciones"
                ).value.trim(),


            /* =============================================
               PRODUCTO
               ============================================= */

            producto:
                "Cable Delta macho a 2 SATA hembra",


            /* =============================================
               🔴 CANTIDAD DINÁMICA

               Viene de verproducto.html.
               ============================================= */

            cantidad:
                cantidad,


            /* =============================================
               🔴 PRECIO DINÁMICO

               1 → $10.00
               2 → $20.00
               ============================================= */

            precio:
                "$" +
                precioTotal.toFixed(2),


            /* =============================================
               ENVÍO
               ============================================= */

            envio:
                "Se coordina",


            /* =============================================
               🔴 TOTAL DINÁMICO

               Coincide con el resumen y PayPhone.
               ============================================= */

            total:
                "$" +
                precioTotal.toFixed(2)

        };


        /* =================================================
           CONVERTIR PEDIDO A JSON
           ================================================= */

        const jsonPedido =
            JSON.stringify(
                pedido
            );


        /* =================================================
           ENVIAR A GOOGLE APPS SCRIPT
           ================================================= */

        try {

            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    mode:
                        "no-cors",

                    keepalive:
                        true,

                    headers:
                        {

                            "Content-Type":
                                "text/plain;charset=UTF-8"

                        },

                    body:
                        jsonPedido

                }

            );


            /* =============================================
               PEDIDO REGISTRADO
               ============================================= */

            mensajeExito.textContent =
                "Pedido registrado. Abriendo el pago...";


            mensajeExito.classList.add(
                "mostrar"
            );


            boton.textContent =
                "Abriendo PayPhone...";


            /* =============================================
               ESPERAR ANTES DE IR A PAYPHONE
               ============================================= */

            setTimeout(

                function () {

                    window.location.href =
                        PAYPHONE_URL;

                },

                700

            );


        } catch (error) {

            console.error(
                "Error:",
                error
            );


            mensajeError.textContent =
                "No se pudo registrar el pedido. Intenta nuevamente.";


            mensajeError.classList.add(
                "mostrar"
            );


            boton.disabled =
                false;


            boton.textContent =
                "Continuar al pago";

        }

    }

</script>
